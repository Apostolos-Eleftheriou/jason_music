<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <meta name="theme-color" content="#fdcb85">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Comic+Neue:wght@700&display=swap&subset=greek"
        rel="stylesheet">
    <title>Jason's Music Player</title>
</head>

<body>
    <div class="wrapper">
        <div class="content">
            <header>
                <div class="header_title">Jason's Music Player</div>
            </header>
            <div class="music_cards"></div>
            <figure class="audio-player">
                <div class="audio_info">
                    <figcaption class="now_playing">Nothing Playing yet!</figcaption>
                    <svg class="loop_song" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24">
                        <path
                            d="M22 13a6.006 6.006 0 0 1-6 6H8A6 6 0 0 1 8 7V6a1 1 0 0 1 1.707-.707l2 2a1 1 0 0 1 0 1.414l-2 2A1 1 0 0 1 8 10V9a4 4 0 0 0 0 8h8a4 4 0 0 0 0-8h-2a1 1 0 0 1 0-2h2a6.006 6.006 0 0 1 6 6z"
                            fill="#5E412F" />
                    </svg>
                </div>
                <audio controls></audio>
            </figure>
        </div>
    </div>
</body>
<script>
    const playlist = [
        { title: 'Ελεφαντάκι', src: 'music/elefantaki.mp3', img: 'images/elefantaki.png' },
        { title: 'Βουνό', src: 'music/vouno.mp3', img: 'images/vouno.png' },
        { title: 'Παγωτατζής', src: 'music/pagotatzis.mp3', img: 'images/pagotatzis.png' },
        { title: 'Pretty Little baby', src: 'music/pretty_little_baby.mp3', img: 'images/pretty.png' }
    ];

    playlist.forEach(music => {
        let template = `<div class="music_card">
                            <img src="${music.img}" alt="${music.title} Album Cover">
                            <h3>${music.title}</h3>
                            <button class="play_button" type="button" data-music="${music.src}" data-title="${music.title}">Play</button>
                        </div>`
        document.querySelector('.music_cards').innerHTML += template;
    });

    const playButtons = document.querySelectorAll('.play_button');
    const audioPlayer = document.querySelector('.audio-player audio');
    playButtons.forEach(button => {
        button.addEventListener('click', () => {
            const musicSrc = button.getAttribute('data-music');
            const nowPlaying = document.querySelector('.now_playing');

            if (audioPlayer.getAttribute('src') === musicSrc) {
                if (!audioPlayer.paused) {
                    audioPlayer.pause();
                    button.textContent = 'Play';
                    nowPlaying.textContent = `Paused: ${button.getAttribute('data-title')}`;
                } else {
                    audioPlayer.play();
                    button.textContent = 'Pause';
                    nowPlaying.textContent = `Now Playing: ${button.getAttribute('data-title')}`;
                }
                return;
            }

            playButtons.forEach(btn => btn.textContent = 'Play');

            nowPlaying.textContent = `Now Playing: ${button.getAttribute('data-title')}`;
            audioPlayer.setAttribute('src', musicSrc);
            audioPlayer.play();
            button.textContent = 'Pause';
        });
    });
    const loopButton = document.querySelector('.loop_song');
    loopButton.addEventListener('click', () => {
        audioPlayer.loop = !audioPlayer.loop;
        loopButton.classList.toggle('active', audioPlayer.loop);
    });

    // Optional: When audio ends, reset button text
    audioPlayer.addEventListener('ended', () => {
        playButtons.forEach(btn => btn.textContent = 'Play');
    });
</script>
